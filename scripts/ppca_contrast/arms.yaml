# Arms of the per-particle contrast experiments (docs/development/ppca_contrast_progress.md), merged into
# scripts/ppca_schedule/config.yaml with a second --configfile. Each pairs with a baseline arm of that file:
# s3_vdam_uniform (VDAM) and s3_scale1_4_uniform (momentum SGD, loading scale 1/4), both with the uniform direction prior.
# --contrast latent: the contrast scales the mean, c = 1 + sd e with a Gaussian latent e (docs/math/ppca_contrast.md).
# c_*: the sd follows the uncentred second moment of e (round 1: the sd ran to its cap and the mean map drifted).
# cc_*: the sd follows the centred second moment (round 2, before the M-step centring: the global gain still drifted).
# cf_*: the sd is fixed at 0.3. cs_*: centred sd, from iteration 800 on. cg_*: the M-step moments of the contrast latent are
# taken about its population mean (--contrast-center, the default from round 3; math note section 9). cgf_*: the same with
# the sd fixed at 0.3. co_*: cg_* with --contrast-orthogonal (the loadings kept orthogonal to the mean volume; math note
# section 10), which is the default of --contrast latent from round 5 on, so the cg_* and cgf_* arms pass
# --no-contrast-orthogonal to stay the unconstrained arms of rounds 3 to 6. cof_*: cgf_* with --contrast-orthogonal (the sd
# fixed at 0.3 and the loadings kept orthogonal to the mean; round 9).
arms:
  c_vdam_latent:
    args: ["--optimizer", "vdam", "--direction-prior", "uniform", "--contrast", "latent", "--contrast-sd", "0.2"]
  c_sgd_latent:
    args: ["--optimizer", "momentum_sgd", "--sgd-learning-rate", "2.4", "--sgd-loading-scale", "0.25",
           "--direction-prior", "uniform", "--contrast", "latent", "--contrast-sd", "0.2"]
  cc_vdam:
    args: ["--optimizer", "vdam", "--direction-prior", "uniform", "--contrast", "latent", "--contrast-sd", "0.2"]
  cc_sgd:
    args: ["--optimizer", "momentum_sgd", "--sgd-learning-rate", "2.4", "--sgd-loading-scale", "0.25",
           "--direction-prior", "uniform", "--contrast", "latent", "--contrast-sd", "0.2"]
  cf_vdam:
    args: ["--optimizer", "vdam", "--direction-prior", "uniform", "--contrast", "latent", "--contrast-sd", "0.3",
           "--no-contrast-estimate-sd"]
  cf_sgd:
    args: ["--optimizer", "momentum_sgd", "--sgd-learning-rate", "2.4", "--sgd-loading-scale", "0.25",
           "--direction-prior", "uniform", "--contrast", "latent", "--contrast-sd", "0.3", "--no-contrast-estimate-sd"]
  cs_vdam:
    args: ["--optimizer", "vdam", "--direction-prior", "uniform", "--contrast", "latent", "--contrast-sd", "0.2",
           "--contrast-start", "800"]
  cs_sgd:
    args: ["--optimizer", "momentum_sgd", "--sgd-learning-rate", "2.4", "--sgd-loading-scale", "0.25",
           "--direction-prior", "uniform", "--contrast", "latent", "--contrast-sd", "0.2", "--contrast-start", "800"]
  cg_vdam:
    args: ["--optimizer", "vdam", "--direction-prior", "uniform", "--contrast", "latent", "--contrast-sd", "0.2",
           "--no-contrast-orthogonal"]
  cg_sgd:
    args: ["--optimizer", "momentum_sgd", "--sgd-learning-rate", "2.4", "--sgd-loading-scale", "0.25",
           "--direction-prior", "uniform", "--contrast", "latent", "--contrast-sd", "0.2",
           "--no-contrast-orthogonal"]
  cgf_vdam:
    args: ["--optimizer", "vdam", "--direction-prior", "uniform", "--contrast", "latent", "--contrast-sd", "0.3",
           "--no-contrast-estimate-sd",
           "--no-contrast-orthogonal"]
  cgf_sgd:
    args: ["--optimizer", "momentum_sgd", "--sgd-learning-rate", "2.4", "--sgd-loading-scale", "0.25",
           "--direction-prior", "uniform", "--contrast", "latent", "--contrast-sd", "0.3", "--no-contrast-estimate-sd",
           "--no-contrast-orthogonal"]
  co_vdam:
    args: ["--optimizer", "vdam", "--direction-prior", "uniform", "--contrast", "latent", "--contrast-sd", "0.2",
           "--contrast-orthogonal"]
  co_sgd:
    args: ["--optimizer", "momentum_sgd", "--sgd-learning-rate", "2.4", "--sgd-loading-scale", "0.25",
           "--direction-prior", "uniform", "--contrast", "latent", "--contrast-sd", "0.2", "--contrast-orthogonal"]

