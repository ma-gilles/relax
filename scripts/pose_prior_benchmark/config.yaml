# Pose-prior benchmark: paths, simulation recipe, refinement settings and scenarios (read by the Snakefile).
# Override any value on the command line, e.g. --config output_root=<dir> natives_dir=<dir>.

# Directory that receives every scenario's dataset and each variant's refinement and evaluation. Required: it
# names a scratch directory of one account, so there is no default.
output_root: null

# Native-library pack that refinement loads, built with `bash scripts/build_test_natives.sh <dir>`. Required.
natives_dir: null

# Python of the relax pixi environment. null: <checkout>/.pixi/envs/default/bin/python.
python: null

# Environment module that provides RELION's relion_reconstruct (the CPU build of 5.0.1 suffices).
relion_module: relion/5.0.1/gcc-14.2.1-cpu

# angdist executable that plots the orientation distributions. null: the one beside the Python running Snakemake.
angdist: null

# Simulation recipe shared by every scenario: the canonical K=1 PDB fixture of
# scripts/prepare_pdb_k1_relion_sanity_benchmark.py (5nrl atoms, white noise, total B-factor 80 A^2).
# The defaults are the 100k-particle, box-256 milestone fixture.
dataset:
  n_images: 100000
  grid_size: 256               # box in pixels; the voxel size is 4.25 * 128 / grid_size A
  # White-noise level. RECOVAR sets the noise variance to noise_level / 50000 and the particles are normalized to
  # background std 1, so at a fixed box the image SNR is proportional to 1 / noise_level, and the SNR per pixel also
  # falls with the box (over the particle disc, level 1: 0.0099 at box 128, 0.0021 at box 256). At 50k particles:
  # box 128 level 1 saturates near Nyquist whatever the prior, level 2 separates the prior variants and level 3
  # leaves the poses essentially random; box 256 level 1 keeps the median pose error of every variant but a wrong
  # prior within 6 deg, and its maps reach 7 to 8 A at 50k particles and 5 to 6 A at 100k.
  noise_level: 1.0
  total_bfactor: 80.0          # A^2
  init_resolution_ang: 30.0    # low-pass of the ground-truth map that starts the refinement
  seed: 17                     # noise seed (RECOVAR draws the poses with its own fixed seed 0)

# relax refine settings; every flag not listed keeps the RELION GUI job default.
refine:
  particle_diameter_ang: 450   # the map's density reaches about 220 A from the centre
  init_resolution: 30          # --ini_high, A
  seed: 1                      # --random_seed: half sets and sampling perturbation
  # --max_healpix_order of every run and the HEALPix order of a fixed prior's file (relax asks for a fixed prior
  # at most at the run's cap). Auto-refine stops at the order where it converges (4 to 6 at 50k particles, box 128,
  # noise levels 1 to 3; 4 at box 256, noise level 1, and 4 to 5 with 100k particles), so a cap of 7 changes none
  # of those runs; for other settings, compare the metrics' run.final_healpix_order with the cap.
  max_healpix_order: 7
  extra_args: []               # appended verbatim to the relax refine command

# relax initial_model (VDAM ab initio, K=1, C1) settings of a scenario that starts from an ab-initio map; the particle
# diameter and every flag not listed keep the refine settings and the RELION GUI job defaults. The particles are
# Fourier-cropped to `box` pixels (the same physical box; the dataset's grid size keeps them as they are) before
# VDAM runs, and its map is padded back to the dataset's grid.
initial_model:
  box: 64
  nr_iter: 200
  seed: 1                      # --random-seed
  extra_args: []               # appended verbatim to the relax initial_model command

# Conical FSC of every evaluated run (scripts/conical_fsc.py): the FSC inside cones of `half_angle_deg` along `n_axes`
# axes spread over the hemisphere, for the half maps and for the final map against the ground truth. cFAR, the
# smallest over the largest area under the cones' curves, is 1 for an isotropic map.
conical_fsc:
  half_angle_deg: 20.0
  n_axes: 100                  # neighbouring axes are about 14 deg apart

# Scenarios the default target runs; any other scenario below is run by requesting its output, e.g.
# <output_root>/kent_cap_abinitio/comparison/variants.png, or by listing it here in an override file. The default run
# starts from the ground truth only: the scenario that starts from an ab-initio map is a separate, explicit run.
run_scenarios: [kent_cap, uniform]

# One entry per scenario: its own simulated dataset. `poses` selects RECOVAR's pose generator; `variants` lists
# how the dataset is refined (the entries of `variants` below); optional `dataset:` and `refine:` entries override
# the shared settings above. `dataset_from` names another scenario whose dataset this one refines instead of
# simulating its own; `init` is the map the refinements start from: `ground_truth` (default: the ground truth
# low-passed at refine.init_resolution) or `abinitio` (relax initial_model on the particles without their poses,
# rigidly registered to the ground truth's frame and hand).
scenarios:
  # RECOVAR's Kent option draws the third COLUMN of each rotation matrix from a Kent distribution (mean direction
  # mu0, major axis mu) and the in-plane angle uniformly. RELION's viewing direction is the third ROW, so it is
  # always uniform in rot: mu0 = z gives a polar cap of preferred views (median tilt 25 deg, 90% within 48 deg;
  # half of the particles in 5% of the sphere, KL 2.4 bits from uniform at HEALPix order 3, 50k particles);
  # mu0 perpendicular to z gives an equatorial belt instead. kappa=8, beta=2 keeps the rejection sampler exact:
  # RECOVAR's default kappa=10, beta=5 accepts 0.05% of the draws and fills most particles from an approximation.
  kent_cap:
    poses: {kind: kent, kappa: 8.0, beta: 2.0, mu: [1.0, 1.0, 0.0], mu0: [0.0, 0.0, 1.0]}
    variants: [learned, fixed_true, fixed_uniform, fixed_wrong_belt]
  # The same particles, refined from an ab-initio map instead of the ground truth. VDAM recovers the particle's shape
  # only at enough SNR (box 256, 100k particles: at noise level 0.5, not at 1), so check the map before reading the
  # refinements: the FSC area to the ground truth in initial_model/registration.json is 0.02 to 0.03 for a map without
  # signal and about 0.24 for one that matches it to the box-64 Nyquist (17 A).
  kent_cap_abinitio:
    dataset_from: kent_cap
    init: abinitio
    variants: [learned, fixed_true, fixed_uniform]
  # The same cap shape at half the concentration (kappa 4, beta 1), so the sparsely populated directions hold more
  # particles: KL 1.47 bits from uniform at HEALPix order 3 (2.36 for kent_cap), median tilt 36 deg and 90% within
  # 67 deg (25 and 48 for kent_cap), half of the particles in 9.3% of the sphere (4.9%), 10% of the particles beyond
  # 67 deg of tilt (1.5%). RECOVAR's rejection sampler fills 100k particles without its approximate fallback.
  kent_cap_mild:
    poses: {kind: kent, kappa: 4.0, beta: 1.0, mu: [1.0, 1.0, 0.0], mu0: [0.0, 0.0, 1.0]}
    variants: [learned, fixed_true, fixed_uniform]
  # kent_cap_mild's particles, refined from an ab-initio map (see kent_cap_abinitio).
  kent_cap_mild_abinitio:
    dataset_from: kent_cap_mild
    init: abinitio
    variants: [learned, fixed_true, fixed_uniform]
  # Control: uniform viewing directions, where the true prior is flat (so a fixed uniform prior is the truth).
  uniform:
    poses: {kind: uniform}
    variants: [learned, fixed_true]

# How a dataset is refined. Without `fixed_prior` relax learns the prior as RELION does (and applies it in global
# searches only). With it, every global search, local search and the final pass scores with the given prior
# (relax refine --fixed-direction-prior), while the learned prior is still estimated, written and evaluated.
# `fixed_prior.kind` is `truth` (the dataset's own viewing-direction distribution), `uniform`, or `kent` with
# explicit kappa, beta, mu and mu0 (the simulator's parameterization); optional `refine:` entries override the
# settings above.
variants:
  learned: {}
  fixed_true:
    fixed_prior: {kind: truth}
  fixed_uniform:
    fixed_prior: {kind: uniform}
  # A confidently wrong prior: the cap's Kent shape moved to an equatorial belt.
  fixed_wrong_belt:
    fixed_prior: {kind: kent, kappa: 8.0, beta: 2.0, mu: [1.0, 1.0, 0.0], mu0: [0.0, 1.0, 0.0]}
