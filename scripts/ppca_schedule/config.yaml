# PPCA schedule experiments: paths, training settings, seeds and arms (read by the Snakefile).
# Override any value on the command line, e.g. --config output_root=<dir> natives_dir=<dir>.

# Directory that receives every run, score and the summary table. Required: it names a scratch directory of one
# account, so there is no default.
output_root: null

# Directory holding librelax_cuda.so built from this checkout (`relax build_cuda --output <dir>/librelax_cuda.so`).
# Required.
natives_dir: null

# Python of a relax pixi environment. null: <checkout>/.pixi/envs/default/bin/python.
python: null

# The owner's plotting script (latents by true state, volume projections, VDAM gates); it runs on the CPU and reads
# a run's last checkpoint, embeddings.npz and iterations.jsonl.
plot_script: /scratch/gpfs/CRYOEM/gilleslab/ry2228/data/ppca_scripts/plot_ppca_run.py

# Curated eleven-state fixture: training/particles.star is what training reads, evaluation/truth.npz holds the
# labels (evaluation only).
fixture: /scratch/gpfs/CRYOEM/gilleslab/mg6942/em_fixtures/ppca_elevenstate20k_noise1_20261003
particle_diameter_ang: 288

# relax ppca_initial_model settings shared by every arm. `args` is appended before each arm's own flags: the fixed batch
# of 300 images (150 per pseudo-half) on every update, the search of +-2 px in 1 px steps, no oversampling and a
# checkpoint every 50 iterations, as in the recipe of /scratch/gpfs/CRYOEM/gilleslab/em_work/ppca_recipe_snapshot_20261030
# (AGENT_BRIEF.md). The fixture is the eleven-state one: q = 10 is its full state space.
train:
  q: 10
  iterations: 3000
  # The recipe's schedule at box 64: [first iteration, Fourier radius, HEALPix order], radius 11 to 31 rising by one shell
  # every 125 iterations to 2500, order 1, 2 from 126 and 3 from 1626 (its stages_linear_b64.json).
  stages: "[[1,11,1],[126,12,2],[251,13,2],[376,14,2],[501,15,2],[626,16,2],[751,17,2],[876,18,2],[1001,19,2],[1126,20,2],[1251,21,2],[1376,22,2],[1501,23,2],[1626,24,3],[1751,25,3],[1876,26,3],[2001,27,3],[2126,28,3],[2251,29,3],[2376,30,3],[2500,31,3]]"
  optimizer: vdam
  args: ["--stochastic-batch-size", "300", "--stochastic-all-iterations", "--balanced-stochastic-halves",
         "--shift-range", "2", "--shift-step", "1", "--oversampling", "0", "--checkpoint-interval", "50"]
  runtime_minutes: 180                        # the Slurm request: 1.4 s per iteration at radius 31, order 3

# One run per arm and seed. Seeds 11 to 13 are the fixture family's usual first three.
seeds: [11, 12, 13]

# Arms to run (null: every arm below). A list, e.g. --config only_arms=[vdam_recipe,sgd_recipe].
only_arms: null

# One entry per arm; `args` is appended verbatim to the training command (a repeated flag wins over the shared
# settings above) and `runtime_minutes` overrides the Slurm request. The arms of rounds 1 to 8 (the stages table, the
# data_vs_prior radius, the accuracy order, constant fudge 1, q = 1 and 3) are in the history of this file; their settings
# and results are in docs/math/vdam_ppca_algorithm.md, sections 18.4 to 18.11 (round 9: 18.12).
#
# The two optimizers against the two schedules of the radius and the HEALPix order, 3000 iterations each. The recipe
# arms follow the table above. The local arms take the radius from RELION's data_vs_prior rule (--radius-rule,
# 18.6) and the order from the expected rotation accuracy (--order-rule accuracy, 18.10), starting at radius 4 and
# order 1 (RELION's start for InitialModel), the order capped at 4 and, for the final embedding pass, at 4.
# Nothing else differs: no --tau2-fudge, so InitialModel's own fudge schedule applies to both, as in the recipe.
# vdam: RELION's VDAM gradient optimizer. momentum_sgd: relax's scalar-curvature SGD with momentum 0.9 and the recipe's
# learning rate 2.4 (the recipe's own "plain SGD" has momentum 0, which relax does not offer).
arms:
  vdam_recipe:
    args: ["--optimizer", "vdam"]
  vdam_local:
    args: ["--optimizer", "vdam", "--stages", "[[1,4,1]]", "--radius-rule", "data_vs_prior",
           "--order-rule", "accuracy", "--order-max", "4", "--final-order-max", "4"]
    runtime_minutes: 900                        # 13.6 s per iteration at radius 29, order 4
  sgd_recipe:
    args: ["--optimizer", "momentum_sgd", "--sgd-learning-rate", "2.4"]
  sgd_local:
    args: ["--optimizer", "momentum_sgd", "--sgd-learning-rate", "2.4", "--stages", "[[1,4,1]]",
           "--radius-rule", "data_vs_prior", "--order-rule", "accuracy", "--order-max", "4", "--final-order-max", "4"]
    runtime_minutes: 900
