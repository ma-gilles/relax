[build-system]
requires = ["setuptools>=77.0", "setuptools_scm>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "relax"
dynamic = ["version"]
authors = [
  { name = "Marc Aurele Gilles", email = "gilles@princeton.edu" }
]
description = "relax: RELION-style cryo-EM refinement in JAX, built on RECOVAR"
readme = "README.md"
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Operating System :: POSIX :: Linux",
]
# relax pins one RECOVAR commit in pixi.toml (feature "pinned": git rev; feature "dev": local editable checkout).
# The name is left unpinned here so the pixi source decides which RECOVAR is installed; the scientific
# dependency set (jax, equinox, ...) comes from RECOVAR's own pins.
dependencies = [
    "recovar",
]

[project.optional-dependencies]
gpu = ["jax[cuda12]==0.9.0.1"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.20.0",
    "ruff>=0.8.0",
    "pre-commit>=3.0",
]

[project.urls]
Homepage = "https://github.com/ma-gilles/relax"

[project.scripts]
relax = "relax.command_line:main_commands"

[tool.setuptools.packages.find]
where = ["."]
include = ["relax*"]

[tool.setuptools.package-data]
"relax.cuda" = ["*.cu", "*.cuh", "*.inc", "Makefile"]
"relax.relion_bind" = ["*.cpp", "*.h", "CMakeLists.txt"]

[tool.setuptools_scm]
write_to = "relax/_version.py"
local_scheme = "no-local-version"
fallback_version = "0.0.0"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E741", "F841"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "silent"
show_error_codes = true
pretty = true
warn_unused_configs = true

[tool.pytest.ini_options]
minversion = "7.4"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true
filterwarnings = [
  "default::DeprecationWarning",
  "ignore:pkg_resources is deprecated as an API:DeprecationWarning",
]
